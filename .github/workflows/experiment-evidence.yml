name: Final Experiment Evidence

on:
  workflow_dispatch:
    inputs:
      app_commit_sha:
        description: Full app commit SHA used to build the deployed image
        required: true
        type: string
      image_digest:
        description: Deployed image digest in sha256 format
        required: true
        type: string
      app_publish_run_id:
        description: App publish workflow run ID
        required: true
        type: string
      terraform_apply_run_id:
        description: Controlled Terraform apply workflow run ID
        required: true
        type: string
      target_url:
        description: Terraform-created HTTPS application URL
        required: true
        default: https://eepistore.web.id
        type: string

permissions:
  contents: read

concurrency:
  group: final-experiment-production
  cancel-in-progress: false

jobs:
  experiment:
    name: Controlled Runtime Experiment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_WORKING_DIR: env/dev
      TF_VERSION: "1.14.4"
      APP_URL: ${{ inputs.target_url }}
      APP_COMMIT_SHA: ${{ inputs.app_commit_sha }}
      APP_IMAGE_DIGEST: ${{ inputs.image_digest }}
      APP_PUBLISH_RUN_ID: ${{ inputs.app_publish_run_id }}
      TERRAFORM_APPLY_RUN_ID: ${{ inputs.terraform_apply_run_id }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INFRA_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TERRAFORM_APPLY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APP_PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$APP_URL" =~ ^https:// ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the exact deployed application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: yudhis55/eepistore
          ref: ${{ inputs.app_commit_sha }}
          path: app-source

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_EXPERIMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app-source/package-lock.json
            tools/evidence/package-lock.json

      - name: Initialize Terraform state access
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Prepare isolated experiment identity
        shell: bash
        run: |
          set -euo pipefail
          EXPERIMENT_ID="exp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PASSWORD="$(openssl rand -base64 36 | tr -d '\n')Aa1"
          echo "::add-mask::$PASSWORD"
          {
            echo "EXPERIMENT_ID=$EXPERIMENT_ID"
            echo "EXPERIMENT_PASSWORD=$PASSWORD"
            echo "EXPERIMENT_BUYER_EMAIL=buyer-${EXPERIMENT_ID}@example.invalid"
            echo "EXPERIMENT_OTHER_BUYER_EMAIL=other-${EXPERIMENT_ID}@example.invalid"
            echo "EXPERIMENT_SELLER_EMAIL=seller-${EXPERIMENT_ID}@example.invalid"
            echo "EXPERIMENT_ADMIN_EMAIL=admin-${EXPERIMENT_ID}@example.invalid"
            echo "EXPERIMENT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
          mkdir -p experiment-evidence/{aws,k6,timing,preflight} app-source/runtime-evidence

      - name: Verify deployed source, image, and readiness
        run: |
          bash scripts/verify-experiment-preflight.sh \
            "$TF_WORKING_DIR" "$APP_URL" "$APP_IMAGE_DIGEST" "$APP_COMMIT_SHA" \
            experiment-evidence/preflight

      - name: Validate source workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: eepistore-thesis-evidence" \
            "https://api.github.com/repos/yudhis55/eepistore/actions/runs/$APP_PUBLISH_RUN_ID" \
            > experiment-evidence/app-publish-run.json
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: eepistore-thesis-evidence" \
            "https://api.github.com/repos/yudhis55/eepistore/actions/runs/$APP_PUBLISH_RUN_ID/jobs?per_page=100" \
            > experiment-evidence/app-publish-jobs.json
          gh api \
            "repos/${{ github.repository }}/actions/runs/$TERRAFORM_APPLY_RUN_ID" \
            > experiment-evidence/terraform-apply-run.json
          gh api \
            "repos/${{ github.repository }}/actions/runs/$TERRAFORM_APPLY_RUN_ID/jobs?per_page=100" \
            > experiment-evidence/terraform-apply-jobs.json

          jq -e --arg sha "$APP_COMMIT_SHA" \
            '.head_sha == $sha and .conclusion == "success" and .event == "workflow_dispatch"' \
            experiment-evidence/app-publish-run.json > /dev/null
          jq -e --arg sha "$INFRA_COMMIT_SHA" \
            '.head_sha == $sha and .conclusion == "success" and .event == "workflow_dispatch"' \
            experiment-evidence/terraform-apply-run.json > /dev/null

          jq -n \
            --slurpfile app experiment-evidence/app-publish-jobs.json \
            --slurpfile infra experiment-evidence/terraform-apply-jobs.json \
            '{
              status: "passed",
              app: {
                requiredJobs: [
                  "Quality Gate",
                  "SAST (CodeQL)",
                  "SCA (npm audit)",
                  "Build, SBOM, and Container Scan",
                  "Publish Scanned Image to ECR"
                ],
                jobs: $app[0].jobs | map({name, conclusion})
              },
              infra: {
                requiredJobs: [
                  "Validate and IaC Security Gates",
                  "Terraform Plan",
                  "Controlled Bootstrap, Apply, or Destroy"
                ],
                jobs: $infra[0].jobs | map({name, conclusion})
              }
            }
            | . as $root
            | [
                $root.app.requiredJobs[] as $required
                | any($root.app.jobs[]; .name == $required and .conclusion == "success")
              ] as $appChecks
            | [
                $root.infra.requiredJobs[] as $required
                | any($root.infra.jobs[]; .name == $required and .conclusion == "success")
              ] as $infraChecks
            | if (all($appChecks[]; .) and all($infraChecks[]; .))
              then .
              else error("required source workflow job is absent or unsuccessful")
              end' > experiment-evidence/scanner-summary.json

      - name: Download controlled apply verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$TERRAFORM_APPLY_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name post-apply-verification \
            --dir experiment-evidence/apply-verification
          cp experiment-evidence/apply-verification/verification-status.txt \
            experiment-evidence/verification-status.txt
          if [ -d experiment-evidence/apply-verification/timing ]; then
            cp experiment-evidence/apply-verification/timing/*.json experiment-evidence/timing/
          fi

      - name: Install application test dependencies
        working-directory: app-source
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install evidence tooling
        working-directory: tools/evidence
        run: npm ci

      - name: Public runtime smoke
        working-directory: app-source
        run: bash scripts/runtime-smoke.sh "$APP_URL" runtime-evidence

      - name: Register isolated experiment users
        working-directory: app-source
        run: npx playwright test tests/e2e/bootstrap-users.spec.ts --reporter=line

      - name: Prepare role and commerce fixtures through one-off ECS task
        run: |
          bash scripts/run-experiment-fixture.sh \
            "$TF_WORKING_DIR" setup experiment-evidence/fixture
          cp experiment-evidence/fixture/fixture.json app-source/runtime-evidence/fixture.json

      - name: Role-aware functional smoke
        working-directory: app-source
        env:
          EXPERIMENT_FIXTURE_FILE: runtime-evidence/fixture.json
        run: npx playwright test tests/e2e/functional.spec.ts

      - name: Bounded passive and active OWASP ZAP scan
        working-directory: app-source
        run: |
          node scripts/render-zap-plan.mjs "$APP_URL" runtime-evidence/zap-plan.yaml
          docker run --rm \
            -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap.sh -cmd -autorun /zap/wrk/runtime-evidence/zap-plan.yaml
          node scripts/zap-gate.mjs \
            runtime-evidence/zap-report.json runtime-evidence/zap-summary.json

      - name: k6 preflight smoke
        working-directory: app-source
        run: |
          docker run --rm \
            -e APP_URL="$APP_URL" \
            -e VUS=5 \
            -e DURATION=30s \
            -v "$PWD:/scripts" \
            grafana/k6@sha256:e7eeddf1ce2361df6920d925297f487c0ba549c44be242c6a9c22f28d9b08efa run \
            --summary-export /scripts/runtime-evidence/k6-smoke.json \
            /scripts/tests/performance/smoke.js

      - name: Run bounded staged k6 trials
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          echo "LOAD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          mkdir -p runtime-evidence/k6
          LOAD_TRIALS=3
          for trial in $(seq 1 "$LOAD_TRIALS"); do
            docker run --rm \
              -e APP_URL="$APP_URL" \
              -e EXPERIMENT_ID="$EXPERIMENT_ID" \
              -e TRIAL_ID="$trial" \
              -v "$PWD:/scripts" \
              grafana/k6@sha256:e7eeddf1ce2361df6920d925297f487c0ba549c44be242c6a9c22f28d9b08efa run \
              --summary-export "/scripts/runtime-evidence/k6/trial-${trial}.json" \
              /scripts/tests/performance/load.js
            if [ "$trial" -lt "$LOAD_TRIALS" ]; then sleep 300; fi
          done
          echo "LOAD_ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Wait for CloudWatch metric publication
        run: sleep 300

      - name: Collect bounded AWS and CloudWatch evidence
        shell: bash
        run: |
          METRIC_START="$(date -u -d "$LOAD_STARTED_AT -5 minutes" +%Y-%m-%dT%H:%M:%SZ)"
          METRIC_END="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/collect-experiment-aws.sh \
            "$TF_WORKING_DIR" "$METRIC_START" "$METRIC_END" experiment-evidence/aws

      - name: Consolidate raw evidence
        if: always()
        shell: bash
        run: |
          cp -R app-source/runtime-evidence/. experiment-evidence/ || true
          echo "EXPERIMENT_ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Remove experiment S3 objects
        if: always() && hashFiles('experiment-evidence/fixture/fixture.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiment-evidence/cleanup
          PUBLIC_BUCKET="$(terraform -chdir="$TF_WORKING_DIR" output -raw s3_public_bucket_name)"
          PRIVATE_BUCKET="$(terraform -chdir="$TF_WORKING_DIR" output -raw s3_private_bucket_name)"
          SELLER_ID="$(jq -r '.users.sellerId' experiment-evidence/fixture/fixture.json)"
          BUYER_ID="$(jq -r '.users.buyerId' experiment-evidence/fixture/fixture.json)"
          aws s3 rm "s3://$PUBLIC_BUCKET/products/$SELLER_ID/" --recursive
          aws s3 rm "s3://$PRIVATE_BUCKET/payments/$BUYER_ID/" --recursive
          jq -n \
            --arg experimentId "$EXPERIMENT_ID" \
            '{experimentId:$experimentId,status:"passed"}' \
            > experiment-evidence/cleanup/s3-cleanup.json

      - name: Clean database fixtures
        if: always() && env.EXPERIMENT_ID != ''
        run: |
          bash scripts/run-experiment-fixture.sh \
            "$TF_WORKING_DIR" cleanup experiment-evidence/cleanup

      - name: Aggregate and validate final evidence
        if: always()
        run: |
          node tools/evidence/aggregate.mjs \
            experiment-evidence experiment-evidence/experiment-evidence.json

      - name: Upload canonical and raw experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-experiment-evidence-${{ github.run_id }}
          path: |
            experiment-evidence
            app-source/playwright-report
          retention-days: 90
