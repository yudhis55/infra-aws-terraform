name: Legacy Evidence Reprocess

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Legacy role preflight or schema 1 evidence reprocess only
        required: true
        default: role-preflight
        type: choice
        options: [role-preflight, reprocess-evidence]
      source_experiment_run_id:
        description: Completed legacy experiment run to reprocess without runtime traffic
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  role-preflight:
    name: Experiment OIDC Role Preflight
    if: inputs.mode == 'role-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_EXPERIMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify assumed role and permitted backend read
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oidc-preflight
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          caller_arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "$account_id" = "557947229844"
          [[ "$caller_arn" == arn:aws:sts::557947229844:assumed-role/eepistore-infra-experiment-role/* ]]
          aws s3api get-bucket-location --bucket eepistore-dev-terraform-state > oidc-preflight/backend-location.json
          jq -n \
            --arg accountId "$account_id" \
            --arg callerArn "$caller_arn" \
            --arg region "${{ vars.AWS_REGION }}" \
            '{status:"passed",accountId:$accountId,callerArn:$callerArn,region:$region}' \
            > oidc-preflight/result.json
      - name: Upload OIDC preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experiment-oidc-preflight-${{ github.run_id }}
          path: oidc-preflight
          if-no-files-found: error
          retention-days: 90

  reprocess-evidence:
    name: Reprocess Immutable Legacy Evidence
    if: inputs.mode == 'reprocess-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate source run
        shell: bash
        run: '[[ "${{ inputs.source_experiment_run_id }}" =~ ^[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/evidence/package-lock.json
      - name: Download immutable source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_experiment_run_id }}
        run: |
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "final-experiment-evidence-$SOURCE_RUN_ID" \
            --dir source-evidence
      - name: Restore original experiment provenance
        env:
          SOURCE_RUN_ID: ${{ inputs.source_experiment_run_id }}
        run: |
          set -euo pipefail
          canonical="source-evidence/experiment-evidence/experiment-evidence.json"
          test -f "$canonical"
          {
            echo "EXPERIMENT_ID=$(jq -r '.metadata.experimentId' "$canonical")"
            echo "AWS_REGION=$(jq -r '.metadata.region' "$canonical")"
            echo "APP_URL=$(jq -r '.metadata.targetUrl' "$canonical")"
            echo "EXPERIMENT_STARTED_AT=$(jq -r '.metadata.startedAt' "$canonical")"
            echo "EXPERIMENT_ENDED_AT=$(jq -r '.metadata.endedAt' "$canonical")"
            echo "APP_COMMIT_SHA=$(jq -r '.provenance.appCommit' "$canonical")"
            echo "INFRA_COMMIT_SHA=$(jq -r '.provenance.infraCommit' "$canonical")"
            echo "APP_IMAGE_DIGEST=$(jq -r '.provenance.imageDigest' "$canonical")"
            echo "APP_PUBLISH_RUN_ID=$(jq -r '.provenance.githubRunIds.appPublish' "$canonical")"
            echo "TERRAFORM_APPLY_RUN_ID=$(jq -r '.provenance.githubRunIds.terraformApply' "$canonical")"
            echo "SOURCE_EXPERIMENT_RUN_ID=$SOURCE_RUN_ID"
          } >> "$GITHUB_ENV"
      - name: Rebuild and validate canonical evidence
        run: |
          npm ci --prefix tools/evidence
          node tools/evidence/aggregate.mjs \
            source-evidence/experiment-evidence \
            source-evidence/experiment-evidence/experiment-evidence.json
      - name: Upload corrected canonical and raw evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reprocessed-final-experiment-evidence-${{ inputs.source_experiment_run_id }}
          path: source-evidence
          if-no-files-found: error
          retention-days: 90
