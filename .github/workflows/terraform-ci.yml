name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy, experiment-agent, experiment-drift-recovery, experiment-rate-test, experiment-performance, experiment-cleanup]
      campaign_id:
        description: Frozen campaign ID for Cycle R/F and experiment mutations
        required: false
        type: string
      cycle_id:
        description: Provisioning cycle represented by this run
        required: false
        default: none
        type: choice
        options: [none, cycle-r, cycle-f]
      campaign_input_digest:
        description: Frozen scientific input digest (sha256:...)
        required: false
        type: string
      app_commit_sha:
        description: Frozen application commit represented by the deployed image
        required: false
        type: string
      image_digest:
        description: Frozen ECR image digest (sha256:...)
        required: false
        type: string
      experiment_expires_at:
        description: UTC cleanup deadline for temporary experiment resources
        required: false
        type: string
      experiment_source_ipv4:
        description: Optional reviewed NAT public IPv4 override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Manual workload operations must serialize with each other, while branch
  # validation must never cancel an approved apply, cleanup, or destroy run.
  group: terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: env/dev
  TF_VERSION: "1.14.4"
  TFLINT_VERSION: "v0.59.1"
  # The workflow provisions short-lived research stacks. The RDS module keeps
  # its production-safe default (false) outside this controlled experiment.
  TF_VAR_skip_final_snapshot: "true"

jobs:
  validate-and-scan:
    name: Validate and IaC Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint --format compact
      - name: Terraform init without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/evidence/package-lock.json
      - name: Validate experiment automation
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          for test_script in scripts/*.test.sh; do
            bash "$test_script"
          done
          node --check scripts/validate-experiment-iam.mjs
          jq empty bootstrap/github-oidc/*.json
          npm ci --prefix tools/evidence
          npm test --prefix tools/evidence
      - name: Trivy IaC gate
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            config \
            --format sarif \
            --output /src/trivy-iac.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignorefile /src/.trivyignore.yaml \
            --skip-dirs /src/env/dev/.terraform \
            --skip-dirs /src/tests/fault-fixtures \
            --skip-files '**/tfplan*' \
            --skip-files '**/*_plan.*' \
            --skip-files '**/plan.txt' \
            /src
      - name: Checkov IaC gate
        if: always()
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-iac.sarif
          category: terraform-trivy
      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: checkov.sarif
          category: terraform-checkov
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-security-evidence
          path: |
            trivy-iac.sarif
            checkov.sarif
          retention-days: 30

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-and-scan]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.AWS_REGION != '' &&
      vars.TF_VAR_PROJECT_NAME != '' &&
      vars.TF_VAR_APP_IMAGE_URI != ''
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
      TF_VAR_app_image_uri: ${{ vars.TF_VAR_APP_IMAGE_URI }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_ROUTE53_ZONE_ID }}
      TF_VAR_enable_https: ${{ vars.TF_VAR_ENABLE_HTTPS }}
      TF_VAR_acm_certificate_arn: ${{ vars.TF_VAR_ACM_CERTIFICATE_ARN }}
      TF_VAR_app_base_url: ${{ vars.TF_VAR_APP_BASE_URL }}
      TF_VAR_experiment_campaign_id: ${{ inputs.campaign_id }}
      TF_VAR_experiment_expires_at: ${{ inputs.experiment_expires_at }}
      TF_VAR_experiment_source_ipv4: ${{ inputs.experiment_source_ipv4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init
      - name: Validate campaign-bound action
        if: startsWith(inputs.action, 'experiment-') || inputs.cycle_id != 'none'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.campaign_id }}" =~ ^campaign-[0-9]{8}-[0-9a-f]{7}-[0-9a-f]{7}$ ]]
          [[ "${{ inputs.campaign_input_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.app_commit_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.image_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TF_VAR_app_image_uri" == *@"${{ inputs.image_digest }}" ]]

          campaign_date="${{ inputs.campaign_id }}"
          campaign_date="${campaign_date#campaign-}"
          campaign_date="${campaign_date%%-*}"
          app_commit="${{ inputs.app_commit_sha }}"
          expected_campaign="campaign-$campaign_date-${app_commit:0:7}-${GITHUB_SHA:0:7}"
          test "${{ inputs.campaign_id }}" = "$expected_campaign"
          started_at="${campaign_date:0:4}-${campaign_date:4:2}-${campaign_date:6:2}T00:00:00Z"
          mkdir -p campaign-metadata
          jq -n \
            --arg appCommit "${{ inputs.app_commit_sha }}" \
            --arg infraCommit "$GITHUB_SHA" \
            --arg imageDigest "${{ inputs.image_digest }}" \
            --arg region "${{ vars.AWS_REGION }}" \
            --arg targetUrl "${{ vars.TF_VAR_APP_BASE_URL }}" \
            --arg mediaUrl "https://media.${{ vars.TF_VAR_DOMAIN_NAME }}" \
            --arg startedAt "$started_at" \
            --slurpfile profile experiments/profiles/final-load-profile.json \
            '{appCommit:$appCommit,infraCommit:$infraCommit,imageDigest:$imageDigest,region:$region,targetUrl:$targetUrl,mediaUrl:$mediaUrl,profile:$profile[0],startedAt:$startedAt}' \
            > campaign-input.json
          node tools/evidence/campaign.mjs campaign-input.json campaign-metadata
          test "$(jq -r .inputDigest campaign-metadata/lineage.json)" = "${{ inputs.campaign_input_digest }}"
          test "$(jq -r .campaignId campaign-metadata/campaign.json)" = "${{ inputs.campaign_id }}"
          if [[ "${{ inputs.action }}" == experiment-* ]]; then
            date -u -d "${{ inputs.experiment_expires_at }}" >/dev/null
            if [ "${{ inputs.action }}" != experiment-cleanup ]; then
              now_epoch="$(date -u +%s)"
              expires_epoch="$(date -u -d "${{ inputs.experiment_expires_at }}" +%s)"
              test "$expires_epoch" -gt "$now_epoch"
              test "$expires_epoch" -le "$((now_epoch + 43200))"
            fi
          fi
      - name: Configure opt-in experiment mode
        shell: bash
        run: |
          case "${{ inputs.action }}" in
            experiment-agent) mode=agent ;;
            experiment-drift-recovery) mode=agent ;;
            experiment-rate-test) mode=rate-test ;;
            experiment-performance) mode=performance ;;
            *) mode=off ;;
          esac
          echo "TF_VAR_experiment_mode=$mode" >> "$GITHUB_ENV"
      - name: Configure controlled destroy overrides
        if: inputs.action == 'destroy'
        run: |
          {
            echo "TF_VAR_enable_deletion_protection=false"
            echo "TF_VAR_force_destroy=true"
          } >> "$GITHUB_ENV"
      - name: Create saved plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          PLAN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PLAN_STARTED_EPOCH="$(date +%s)"
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          case "${{ inputs.action }}" in
            experiment-agent) node ../../scripts/validate-experiment-plan.mjs tfplan.json agent ;;
            experiment-drift-recovery) node ../../scripts/validate-experiment-plan.mjs tfplan.json drift-recovery ;;
            experiment-rate-test) node ../../scripts/validate-experiment-plan.mjs tfplan.json rate-test ;;
            experiment-performance) node ../../scripts/validate-experiment-plan.mjs tfplan.json performance ;;
            experiment-cleanup) node ../../scripts/validate-experiment-plan.mjs tfplan.json cleanup ;;
          esac
          jq '{
            create: [.resource_changes[]? | select(.change.actions == ["create"])] | length,
            update: [.resource_changes[]? | select(.change.actions == ["update"])] | length,
            delete: [.resource_changes[]? | select(.change.actions == ["delete"])] | length,
            replace: [.resource_changes[]? | select(.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])] | length
          }' tfplan.json > tfplan-summary.json
          PLAN_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PLAN_ENDED_EPOCH="$(date +%s)"
          jq -n \
            --arg startedAt "$PLAN_STARTED_AT" \
            --arg endedAt "$PLAN_ENDED_AT" \
            --argjson durationSeconds "$((PLAN_ENDED_EPOCH - PLAN_STARTED_EPOCH))" \
            '{status:"passed", startedAt:$startedAt, endedAt:$endedAt, durationSeconds:$durationSeconds}' \
            > plan-timing.json
          jq -n \
            --arg campaignId "${{ inputs.campaign_id }}" \
            --arg cycleId "${{ inputs.cycle_id }}" \
            --arg inputDigest "${{ inputs.campaign_input_digest }}" \
            --arg appCommit "${{ inputs.app_commit_sha }}" \
            --arg infraCommit "$GITHUB_SHA" \
            --arg imageDigest "${{ inputs.image_digest }}" \
            --arg action "${{ inputs.action }}" \
            --arg runId "$GITHUB_RUN_ID" \
            '{campaignId:($campaignId | if length > 0 then . else null end),cycleId:$cycleId,inputDigest:($inputDigest | if length > 0 then . else null end),appCommit:($appCommit | if length > 0 then . else null end),infraCommit:$infraCommit,imageDigest:($imageDigest | if length > 0 then . else null end),action:$action,githubRunId:$runId}' \
            > campaign-run.json
      - name: Upload reviewable plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-review-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
            ${{ env.TF_WORKING_DIR }}/tfplan-summary.json
            ${{ env.TF_WORKING_DIR }}/plan-timing.json
            ${{ env.TF_WORKING_DIR }}/campaign-run.json
            campaign-metadata
          retention-days: 30
      - name: Upload short-lived binary plan
        if: inputs.action != 'plan'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-saved-plan-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan-timing.json
            ${{ env.TF_WORKING_DIR }}/campaign-run.json
          retention-days: 1

  apply:
    name: Controlled Bootstrap, Apply, or Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [plan]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action != 'plan'
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
      TF_VAR_app_image_uri: ${{ vars.TF_VAR_APP_IMAGE_URI }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_ROUTE53_ZONE_ID }}
      TF_VAR_enable_https: ${{ vars.TF_VAR_ENABLE_HTTPS }}
      TF_VAR_acm_certificate_arn: ${{ vars.TF_VAR_ACM_CERTIFICATE_ARN }}
      TF_VAR_app_base_url: ${{ vars.TF_VAR_APP_BASE_URL }}
      TF_VAR_experiment_campaign_id: ${{ inputs.campaign_id }}
      TF_VAR_experiment_expires_at: ${{ inputs.experiment_expires_at }}
      TF_VAR_experiment_source_ipv4: ${{ inputs.experiment_source_ipv4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 21600
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init
      - name: Configure opt-in experiment mode
        shell: bash
        run: |
          case "${{ inputs.action }}" in
            experiment-agent) mode=agent ;;
            experiment-drift-recovery) mode=agent ;;
            experiment-rate-test) mode=rate-test ;;
            experiment-performance) mode=performance ;;
            *) mode=off ;;
          esac
          echo "TF_VAR_experiment_mode=$mode" >> "$GITHUB_ENV"
      - name: Configure controlled destroy overrides
        if: inputs.action == 'destroy'
        run: |
          {
            echo "TF_VAR_enable_deletion_protection=false"
            echo "TF_VAR_force_destroy=true"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-saved-plan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}
      - name: Drain ECS service before destroy
        if: inputs.action == 'destroy'
        run: bash scripts/prepare-ecs-destroy.sh "${{ env.TF_WORKING_DIR }}" destroy-evidence/preparation
      - name: Disable workload deletion protection
        if: inputs.action == 'destroy'
        shell: bash
        run: |
          DB_IDENTIFIER="${TF_VAR_project_name}-dev-db"
          if aws rds describe-db-instances \
            --db-instance-identifier "$DB_IDENTIFIER" \
            >/dev/null 2>&1; then
            aws rds modify-db-instance \
              --db-instance-identifier "$DB_IDENTIFIER" \
              --no-deletion-protection \
              --apply-immediately \
              >/dev/null
            aws rds wait db-instance-available \
              --db-instance-identifier "$DB_IDENTIFIER"
            echo "Disabled deletion protection for RDS $DB_IDENTIFIER."
          else
            echo "RDS instance $DB_IDENTIFIER is already absent."
          fi

          ALB_NAME="${TF_VAR_project_name}-alb"
          ALB_ARN="$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || true)"
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            aws elbv2 modify-load-balancer-attributes \
              --load-balancer-arn "$ALB_ARN" \
              --attributes Key=deletion_protection.enabled,Value=false \
              >/dev/null
            echo "Disabled deletion protection for ALB $ALB_NAME."
          else
            echo "ALB $ALB_NAME is already absent."
          fi
      - name: Empty versioned workload buckets
        if: inputs.action == 'destroy'
        shell: bash
        run: scripts/empty-workload-buckets.sh "$TF_VAR_project_name" dev
      - name: Apply reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          mkdir -p ../../verification-evidence/timing
          cp plan-timing.json ../../verification-evidence/timing/plan-timing.json
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STARTED_EPOCH="$(date +%s)"
          set +e
          terraform apply -auto-approve tfplan
          EXIT_CODE=$?
          set -e
          ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ENDED_EPOCH="$(date +%s)"
          STATUS="passed"
          if [ "$EXIT_CODE" -ne 0 ]; then STATUS="failed"; fi
          jq -n \
            --arg status "$STATUS" \
            --arg startedAt "$STARTED_AT" \
            --arg endedAt "$ENDED_AT" \
            --argjson durationSeconds "$((ENDED_EPOCH - STARTED_EPOCH))" \
            '{status:$status, startedAt:$startedAt, endedAt:$endedAt, durationSeconds:$durationSeconds}' \
            > ../../verification-evidence/timing/apply-timing.json
          exit "$EXIT_CODE"
      - name: Run database migrations as one-off ECS task
        if: inputs.action == 'apply'
        run: bash scripts/run-ecs-migration.sh "${{ env.TF_WORKING_DIR }}" migration-evidence
      - name: Post-apply AWS verification
        if: inputs.action == 'apply'
        run: bash scripts/verify-aws-post-apply.sh "${{ env.TF_WORKING_DIR }}" verification-evidence
      - name: Verify temporary experiment state
        if: startsWith(inputs.action, 'experiment-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiment-change-evidence
          terraform -chdir="${{ env.TF_WORKING_DIR }}" output -json > experiment-change-evidence/terraform-output.json
          jq -n \
            --arg campaignId "${{ inputs.campaign_id }}" \
            --arg cycleId "${{ inputs.cycle_id }}" \
            --arg inputDigest "${{ inputs.campaign_input_digest }}" \
            --arg action "${{ inputs.action }}" \
            --arg runId "$GITHUB_RUN_ID" \
            '{status:"passed",campaignId:$campaignId,cycleId:$cycleId,inputDigest:$inputDigest,action:$action,githubRunId:$runId}' \
            > experiment-change-evidence/change.json
          if [ "${{ inputs.action }}" = experiment-cleanup ]; then
            jq -e '.experiment_mode.value == "off" and .experiment_agent_instance_id.value == null' experiment-change-evidence/terraform-output.json > /dev/null
            waf_arn="$(terraform -chdir="${{ env.TF_WORKING_DIR }}" output -raw waf_web_acl_arn)"
            waf_name="$(echo "$waf_arn" | awk -F/ '{print $(NF-1)}')"
            waf_id="$(echo "$waf_arn" | awk -F/ '{print $NF}')"
            aws wafv2 get-web-acl --scope REGIONAL --name "$waf_name" --id "$waf_id" > experiment-change-evidence/waf-after-cleanup.json
            jq -e '
              ([.WebACL.Rules[].Name] | index("ExperimentEndpointPermanentDeny")) != null and
              ([.WebACL.Rules[].Name] | index("ExperimentRateLimit")) == null and
              ([.WebACL.Rules[].Name] | index("ExperimentPerformanceAllow")) == null
            ' experiment-change-evidence/waf-after-cleanup.json > /dev/null
          else
            jq -e '.experiment_agent_instance_id.value != null' experiment-change-evidence/terraform-output.json > /dev/null
          fi
          if [ "${{ inputs.action }}" = experiment-drift-recovery ]; then
            drift_target="$(terraform -chdir="${{ env.TF_WORKING_DIR }}" output -raw experiment_drift_target_arn)"
            drift_id="${drift_target##*/}"
            remaining="$(aws ec2 describe-tags --filters "Name=resource-id,Values=$drift_id" "Name=key,Values=ExperimentDrift" --query 'length(Tags)' --output text)"
            test "$remaining" = 0
            set +e
            terraform -chdir="${{ env.TF_WORKING_DIR }}" plan -detailed-exitcode -out=post-drift-recovery.tfplan > experiment-change-evidence/post-recovery-plan.txt
            no_change_code=$?
            set -e
            test "$no_change_code" -eq 0
            jq -n '{status:"passed",remainingControlledDriftTags:0,noChangePlan:true}' > experiment-change-evidence/drift-recovery.json
          fi
      - name: Verify empty state after destroy
        if: inputs.action == 'destroy'
        run: |
          mkdir -p destroy-evidence
          terraform -chdir="${{ env.TF_WORKING_DIR }}" state list > destroy-evidence/state-list.txt
          test ! -s destroy-evidence/state-list.txt
          echo "PASS terraform-state-empty" > destroy-evidence/verification-status.txt
          bash scripts/verify-aws-post-destroy.sh "$TF_VAR_project_name" dev destroy-evidence
      - name: Consolidate apply timing evidence
        if: always() && inputs.action == 'apply'
        run: |
          mkdir -p verification-evidence/timing
          if [ -f migration-evidence/timing/migration-timing.json ]; then
            cp migration-evidence/timing/migration-timing.json verification-evidence/timing/
          fi
      - name: Upload migration evidence
        if: always() && inputs.action == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-evidence
          path: migration-evidence
          retention-days: 30
      - name: Upload post-apply evidence
        if: always() && inputs.action == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-apply-verification
          path: verification-evidence
          retention-days: 30
      - name: Upload post-destroy evidence
        if: always() && inputs.action == 'destroy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-destroy-verification
          path: destroy-evidence
          retention-days: 30
      - name: Upload experiment change evidence
        if: always() && startsWith(inputs.action, 'experiment-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: experiment-change-${{ inputs.action }}-${{ github.run_id }}
          path: experiment-change-evidence
          if-no-files-found: error
          retention-days: 90
