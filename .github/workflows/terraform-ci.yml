name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options: [plan, bootstrap-ecr, apply, destroy]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: env/dev
  TF_VERSION: "1.14.4"
  TFLINT_VERSION: "v0.59.1"

jobs:
  validate-and-scan:
    name: Validate and IaC Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint --format compact
      - name: Terraform init without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/evidence/package-lock.json
      - name: Validate experiment automation
        run: |
          bash -n scripts/*.sh
          node --check scripts/validate-experiment-iam.mjs
          jq empty bootstrap/github-oidc/*.json
          npm ci --prefix tools/evidence
          npm test --prefix tools/evidence
      - name: Trivy IaC gate
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            config \
            --format sarif \
            --output /src/trivy-iac.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignorefile /src/.trivyignore.yaml \
            --skip-dirs /src/env/dev/.terraform \
            --skip-files '**/tfplan*' \
            --skip-files '**/*_plan.*' \
            --skip-files '**/plan.txt' \
            /src
      - name: Checkov IaC gate
        if: always()
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-iac.sarif
          category: terraform-trivy
      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: checkov.sarif
          category: terraform-checkov
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-security-evidence
          path: |
            trivy-iac.sarif
            checkov.sarif
          retention-days: 30

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-and-scan]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.AWS_REGION != '' &&
      vars.TF_VAR_PROJECT_NAME != '' &&
      (inputs.action == 'bootstrap-ecr' || vars.TF_VAR_APP_IMAGE_URI != '')
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
      TF_VAR_app_image_uri: ${{ vars.TF_VAR_APP_IMAGE_URI || '557947229844.dkr.ecr.ap-southeast-3.amazonaws.com/eepistore-repo:0000000000000000000000000000000000000000' }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_ROUTE53_ZONE_ID }}
      TF_VAR_enable_https: ${{ vars.TF_VAR_ENABLE_HTTPS }}
      TF_VAR_acm_certificate_arn: ${{ vars.TF_VAR_ACM_CERTIFICATE_ARN }}
      TF_VAR_app_base_url: ${{ vars.TF_VAR_APP_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init
      - name: Configure controlled destroy overrides
        if: inputs.action == 'destroy'
        run: |
          {
            echo "TF_VAR_enable_deletion_protection=false"
            echo "TF_VAR_skip_final_snapshot=true"
            echo "TF_VAR_force_destroy=true"
            echo "TF_VAR_ecr_force_delete=true"
          } >> "$GITHUB_ENV"
      - name: Create saved plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          PLAN_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PLAN_STARTED_EPOCH="$(date +%s)"
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          elif [ "${{ inputs.action }}" = "bootstrap-ecr" ]; then
            terraform plan -target=module.ecr -out=tfplan
          else
            terraform plan -out=tfplan
          fi
          terraform show -no-color tfplan > tfplan.txt
          terraform show -json tfplan > tfplan.json
          jq '{
            create: [.resource_changes[]? | select(.change.actions == ["create"])] | length,
            update: [.resource_changes[]? | select(.change.actions == ["update"])] | length,
            delete: [.resource_changes[]? | select(.change.actions == ["delete"])] | length,
            replace: [.resource_changes[]? | select(.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])] | length
          }' tfplan.json > tfplan-summary.json
          PLAN_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PLAN_ENDED_EPOCH="$(date +%s)"
          jq -n \
            --arg startedAt "$PLAN_STARTED_AT" \
            --arg endedAt "$PLAN_ENDED_AT" \
            --argjson durationSeconds "$((PLAN_ENDED_EPOCH - PLAN_STARTED_EPOCH))" \
            '{status:"passed", startedAt:$startedAt, endedAt:$endedAt, durationSeconds:$durationSeconds}' \
            > plan-timing.json
      - name: Upload reviewable plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-review
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
            ${{ env.TF_WORKING_DIR }}/tfplan-summary.json
            ${{ env.TF_WORKING_DIR }}/plan-timing.json
          retention-days: 30
      - name: Upload short-lived binary plan
        if: inputs.action == 'bootstrap-ecr' || inputs.action == 'apply' || inputs.action == 'destroy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-saved-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan-timing.json
          retention-days: 1

  apply:
    name: Controlled Bootstrap, Apply, or Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [plan]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.action == 'bootstrap-ecr' || inputs.action == 'apply' || inputs.action == 'destroy')
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
      TF_VAR_app_image_uri: ${{ vars.TF_VAR_APP_IMAGE_URI || '557947229844.dkr.ecr.ap-southeast-3.amazonaws.com/eepistore-repo:0000000000000000000000000000000000000000' }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_ROUTE53_ZONE_ID }}
      TF_VAR_enable_https: ${{ vars.TF_VAR_ENABLE_HTTPS }}
      TF_VAR_acm_certificate_arn: ${{ vars.TF_VAR_ACM_CERTIFICATE_ARN }}
      TF_VAR_app_base_url: ${{ vars.TF_VAR_APP_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init
      - name: Configure controlled destroy overrides
        if: inputs.action == 'destroy'
        run: |
          {
            echo "TF_VAR_enable_deletion_protection=false"
            echo "TF_VAR_skip_final_snapshot=true"
            echo "TF_VAR_force_destroy=true"
            echo "TF_VAR_ecr_force_delete=true"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-saved-plan
          path: ${{ env.TF_WORKING_DIR }}
      - name: Disable workload deletion protection
        if: inputs.action == 'destroy'
        shell: bash
        run: |
          DB_IDENTIFIER="${TF_VAR_project_name}-dev-db"
          if aws rds describe-db-instances \
            --db-instance-identifier "$DB_IDENTIFIER" \
            >/dev/null 2>&1; then
            aws rds modify-db-instance \
              --db-instance-identifier "$DB_IDENTIFIER" \
              --no-deletion-protection \
              --apply-immediately \
              >/dev/null
            aws rds wait db-instance-available \
              --db-instance-identifier "$DB_IDENTIFIER"
            echo "Disabled deletion protection for RDS $DB_IDENTIFIER."
          else
            echo "RDS instance $DB_IDENTIFIER is already absent."
          fi

          ALB_NAME="${TF_VAR_project_name}-alb"
          ALB_ARN="$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || true)"
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            aws elbv2 modify-load-balancer-attributes \
              --load-balancer-arn "$ALB_ARN" \
              --attributes Key=deletion_protection.enabled,Value=false \
              >/dev/null
            echo "Disabled deletion protection for ALB $ALB_NAME."
          else
            echo "ALB $ALB_NAME is already absent."
          fi
      - name: Empty ECR before controlled destroy
        if: inputs.action == 'destroy'
        shell: bash
        run: |
          REPOSITORY_NAME="${TF_VAR_project_name}-repo"
          if ! aws ecr describe-repositories \
            --repository-names "$REPOSITORY_NAME" \
            >/dev/null 2>&1; then
            echo "ECR repository $REPOSITORY_NAME is already absent."
            exit 0
          fi

          aws ecr list-images \
            --repository-name "$REPOSITORY_NAME" \
            --query 'imageIds' \
            --output json > ecr-image-ids.json

          IMAGE_COUNT="$(jq 'length' ecr-image-ids.json)"
          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "ECR repository $REPOSITORY_NAME is already empty."
            exit 0
          fi

          aws ecr batch-delete-image \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids file://ecr-image-ids.json \
            >/dev/null
          echo "Deleted $IMAGE_COUNT image references from $REPOSITORY_NAME."
      - name: Empty versioned workload buckets
        if: inputs.action == 'destroy'
        shell: bash
        run: scripts/empty-workload-buckets.sh "$TF_VAR_project_name" dev
      - name: Apply reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          mkdir -p ../../verification-evidence/timing
          cp plan-timing.json ../../verification-evidence/timing/plan-timing.json
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STARTED_EPOCH="$(date +%s)"
          set +e
          terraform apply -auto-approve tfplan
          EXIT_CODE=$?
          set -e
          ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ENDED_EPOCH="$(date +%s)"
          STATUS="passed"
          if [ "$EXIT_CODE" -ne 0 ]; then STATUS="failed"; fi
          jq -n \
            --arg status "$STATUS" \
            --arg startedAt "$STARTED_AT" \
            --arg endedAt "$ENDED_AT" \
            --argjson durationSeconds "$((ENDED_EPOCH - STARTED_EPOCH))" \
            '{status:$status, startedAt:$startedAt, endedAt:$endedAt, durationSeconds:$durationSeconds}' \
            > ../../verification-evidence/timing/apply-timing.json
          exit "$EXIT_CODE"
      - name: Verify ECR bootstrap
        if: inputs.action == 'bootstrap-ecr'
        run: |
          mkdir -p bootstrap-evidence
          terraform -chdir="${{ env.TF_WORKING_DIR }}" state list |
            grep '^module.ecr' > bootstrap-evidence/ecr-state.txt
          aws ecr describe-repositories \
            --repository-names "${{ vars.TF_VAR_PROJECT_NAME }}-repo" \
            --query 'repositories[0].{repositoryUri:repositoryUri,imageTagMutability:imageTagMutability,encryptionType:encryptionConfiguration.encryptionType}' \
            > bootstrap-evidence/ecr.json
      - name: Run database migrations as one-off ECS task
        if: inputs.action == 'apply'
        run: bash scripts/run-ecs-migration.sh "${{ env.TF_WORKING_DIR }}" migration-evidence
      - name: Post-apply AWS verification
        if: inputs.action == 'apply'
        run: bash scripts/verify-aws-post-apply.sh "${{ env.TF_WORKING_DIR }}" verification-evidence
      - name: Verify empty state after destroy
        if: inputs.action == 'destroy'
        run: |
          mkdir -p destroy-evidence
          terraform -chdir="${{ env.TF_WORKING_DIR }}" state list > destroy-evidence/state-list.txt
          test ! -s destroy-evidence/state-list.txt
          echo "PASS terraform-state-empty" > destroy-evidence/verification-status.txt
      - name: Consolidate apply timing evidence
        if: always() && inputs.action == 'apply'
        run: |
          mkdir -p verification-evidence/timing
          if [ -f migration-evidence/timing/migration-timing.json ]; then
            cp migration-evidence/timing/migration-timing.json verification-evidence/timing/
          fi
      - name: Upload migration evidence
        if: always() && inputs.action == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-evidence
          path: migration-evidence
          retention-days: 30
      - name: Upload ECR bootstrap evidence
        if: always() && inputs.action == 'bootstrap-ecr'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecr-bootstrap-verification
          path: bootstrap-evidence
          retention-days: 30
      - name: Upload post-apply evidence
        if: always() && inputs.action == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-apply-verification
          path: verification-evidence
          retention-days: 30
      - name: Upload post-destroy evidence
        if: always() && inputs.action == 'destroy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-destroy-verification
          path: destroy-evidence
          retention-days: 30
