name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: env/dev

jobs:
  validate-and-scan:
    name: Format, Validate, IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint -f compact

      - name: Terraform init without remote backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Trivy IaC scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Checkov IaC scan
        if: always()
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload IaC scan SARIF
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

      - name: Upload Terraform CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-ci-evidence
          path: |
            trivy-iac.sarif
            checkov.sarif
          if-no-files-found: ignore

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate-and-scan]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'destroy') &&
      vars.AWS_REGION != '' &&
      vars.TF_VAR_PROJECT_NAME != '' &&
      vars.TF_VAR_APP_IMAGE_URI != ''
    env:
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_app_image_uri: ${{ vars.TF_VAR_APP_IMAGE_URI }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_ROUTE53_ZONE_ID }}
      TF_VAR_enable_https: ${{ vars.TF_VAR_ENABLE_HTTPS }}
      TF_VAR_acm_certificate_arn: ${{ vars.TF_VAR_ACM_CERTIFICATE_ARN }}
      TF_VAR_app_base_url: ${{ vars.TF_VAR_APP_BASE_URL }}
      TF_VAR_auth_secret: ${{ secrets.TF_VAR_AUTH_SECRET }}
      TF_VAR_smtp_user: ${{ secrets.TF_VAR_SMTP_USER }}
      TF_VAR_smtp_pass: ${{ secrets.TF_VAR_SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Configure destroy cost-saving overrides
        if: inputs.action == 'destroy'
        run: |
          echo "TF_VAR_enable_deletion_protection=false" >> "$GITHUB_ENV"
          echo "TF_VAR_skip_final_snapshot=true" >> "$GITHUB_ENV"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Export human-readable plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.txt

  apply:
    name: Terraform Apply + Verify
    runs-on: ubuntu-latest
    needs: [plan]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.action == 'apply' || inputs.action == 'destroy') &&
      vars.AWS_REGION != '' &&
      vars.TF_VAR_PROJECT_NAME != '' &&
      vars.TF_VAR_APP_IMAGE_URI != ''
    environment: production
    env:
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_app_image_uri: ${{ vars.TF_VAR_APP_IMAGE_URI }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_DOMAIN_NAME }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_ROUTE53_ZONE_ID }}
      TF_VAR_enable_https: ${{ vars.TF_VAR_ENABLE_HTTPS }}
      TF_VAR_acm_certificate_arn: ${{ vars.TF_VAR_ACM_CERTIFICATE_ARN }}
      TF_VAR_app_base_url: ${{ vars.TF_VAR_APP_BASE_URL }}
      TF_VAR_auth_secret: ${{ secrets.TF_VAR_AUTH_SECRET }}
      TF_VAR_smtp_user: ${{ secrets.TF_VAR_SMTP_USER }}
      TF_VAR_smtp_pass: ${{ secrets.TF_VAR_SMTP_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Configure destroy cost-saving overrides
        if: inputs.action == 'destroy'
        run: |
          echo "TF_VAR_enable_deletion_protection=false" >> "$GITHUB_ENV"
          echo "TF_VAR_skip_final_snapshot=true" >> "$GITHUB_ENV"

      - name: Download reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Post-apply AWS verification
        if: inputs.action == 'apply'
        run: bash scripts/verify-aws-post-apply.sh "${{ env.TF_WORKING_DIR }}" verification-evidence

      - name: Post-destroy Terraform state verification
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail
          mkdir -p destroy-evidence
          terraform -chdir="${{ env.TF_WORKING_DIR }}" state list > destroy-evidence/state-list.txt

          if [ -s destroy-evidence/state-list.txt ]; then
            echo "Terraform state still contains resources after destroy:" >&2
            cat destroy-evidence/state-list.txt >&2
            exit 1
          fi

          echo "PASS terraform-state-empty" > destroy-evidence/verification-status.txt

      - name: Upload post-apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-apply-verification
          path: verification-evidence
          if-no-files-found: ignore

      - name: Upload post-destroy evidence
        if: always() && inputs.action == 'destroy'
        uses: actions/upload-artifact@v4
        with:
          name: post-destroy-verification
          path: destroy-evidence
          if-no-files-found: ignore
