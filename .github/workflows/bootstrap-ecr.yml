name: Bootstrap Immutable ECR

on:
  workflow_dispatch:
    inputs:
      action:
        description: Review a plan or apply the saved plan from this run
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: bootstrap-ecr
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-3
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.14.4"
  TF_WORKING_DIR: bootstrap/ecr

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform -chdir="$TF_WORKING_DIR" init -backend=false
      - run: terraform -chdir="$TF_WORKING_DIR" validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform -chdir="$TF_WORKING_DIR" init
      - name: Create reviewable saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_WORKING_DIR" plan -out=tfplan
          terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan > "$TF_WORKING_DIR/tfplan.txt"
          terraform -chdir="$TF_WORKING_DIR" show -json tfplan > "$TF_WORKING_DIR/tfplan.json"
          jq '{create:[.resource_changes[]? | select(.change.actions == ["create"])] | length,update:[.resource_changes[]? | select(.change.actions == ["update"])] | length,delete:[.resource_changes[]? | select(.change.actions == ["delete"])] | length,replace:[.resource_changes[]? | select(.change.actions == ["delete","create"] or .change.actions == ["create","delete"])] | length}' "$TF_WORKING_DIR/tfplan.json" > "$TF_WORKING_DIR/tfplan-summary.json"
          jq -e '.delete == 0 and .replace == 0' "$TF_WORKING_DIR/tfplan-summary.json" > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecr-bootstrap-plan-${{ github.run_id }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
            ${{ env.TF_WORKING_DIR }}/tfplan-summary.json
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.action == 'apply'
        with:
          name: ecr-bootstrap-saved-plan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  apply:
    if: inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform -chdir="$TF_WORKING_DIR" init
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecr-bootstrap-saved-plan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}
      - run: terraform -chdir="$TF_WORKING_DIR" apply -auto-approve tfplan
      - name: Verify retained immutable repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ecr-bootstrap-evidence
          terraform -chdir="$TF_WORKING_DIR" output -json > ecr-bootstrap-evidence/terraform-output.json
          aws ecr describe-repositories --repository-names eepistore-repo > ecr-bootstrap-evidence/repository.json
          jq -e '.repositories[0].imageTagMutability == "IMMUTABLE" and .repositories[0].imageScanningConfiguration.scanOnPush == true and .repositories[0].encryptionConfiguration.encryptionType == "KMS"' ecr-bootstrap-evidence/repository.json > /dev/null
          jq -n --arg runId "$GITHUB_RUN_ID" '{status:"passed",githubRunId:$runId,retainedAcrossWorkloadCycles:true}' > ecr-bootstrap-evidence/result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecr-bootstrap-verification-${{ github.run_id }}
          path: ecr-bootstrap-evidence
          if-no-files-found: error
          retention-days: 90
